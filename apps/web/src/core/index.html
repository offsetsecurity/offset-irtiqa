<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PRODUCT_NAME}} — for {{FRAMEWORK_SHORT}}</title>
<link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#f5f7fb; --panel:#fff; --ink:#0f172a; --muted:#64748b; --line:#e6eaf2;
    --brand:#2457D6; --brand-2:#3b82f6; --navy:#0B1220; --sidebar:#16203A;
    --green:#16a34a; --amber:#d97706; --red:#dc2626; --slate:#475569; --slate-soft:#f1f5f9;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Inter','Segoe UI',Roboto,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  .app{display:grid;grid-template-columns:292px 1fr;min-height:100vh}
  .app.nav-collapsed{grid-template-columns:96px 1fr}
  /* A rounded panel that floats just off the edge, and scrolls on its own when
     the menu is longer than the window, as Assure's is. */
  .sidebar{background:var(--sidebar);color:#cbd5e1;padding:18px 14px;display:flex;flex-direction:column;gap:6px;
           position:sticky;top:12px;height:calc(100vh - 24px);margin:12px 0 12px 12px;border-radius:22px;
           overflow:hidden}
  .sidebar-head{position:relative}
  .collapse-btn{position:absolute;top:-6px;right:-4px;width:30px;height:30px;display:flex;align-items:center;
                justify-content:center;border:0;border-radius:8px;background:none;color:#8a96ab;cursor:pointer}
  .collapse-btn:hover{background:rgba(255,255,255,.08);color:#fff}
  .collapse-btn .icon{width:18px;height:18px}
  .sidebar .mark{width:34px;height:34px;display:block}
  .nav{display:flex;flex-direction:column}
  /* The part that scrolls. Everything else in the panel stays where it is. */
  .nav.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;margin-right:-8px;padding-right:8px;
              scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
  .nav.scroll.more{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 38px),transparent);
                   mask-image:linear-gradient(to bottom,#000 calc(100% - 38px),transparent)}
  .nav.pinned{flex:none;gap:2px;border-top:1px solid rgba(255,255,255,.09);padding-top:8px;margin-top:2px}
  .sidebar-user{flex:none;display:flex;align-items:center;gap:10px;padding:10px 8px 2px;
                border-top:1px solid rgba(255,255,255,.09);margin-top:6px}
  .sidebar-user .avatar{width:32px;height:32px;flex:none;border-radius:50%;display:flex;align-items:center;
                        justify-content:center;background:rgba(36,87,214,.38);color:#fff;font-size:12px;font-weight:700}
  .sidebar-user .who-text{display:flex;flex-direction:column;min-width:0;line-height:1.25}
  .sidebar-user .who-text b{color:#e2e8f0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sidebar-user .who-text em{font-style:normal;color:#8a96ab;font-size:11px;text-transform:capitalize}
  .nav-collapsed .sidebar-user{justify-content:center;padding:10px 0 2px}
  .nav-collapsed .sidebar-user .who-text{display:none}
  .nav-group{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}
  .nav-group:last-child{border-bottom:0}
  /* Sections that open and close. The section you are in is always open. */
  .nav-section{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.08)}
  .nav-section:last-child{border-bottom:0}
  .nav-section-head{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;
                    font:inherit;font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
                    color:#7d8aa3;padding:10px 12px 8px;cursor:pointer;border-radius:8px;text-align:left}
  .nav-section-head:hover{color:#e2e8f0}
  .nav-section-head .chev{width:13px;height:13px;flex:none;opacity:.8;transition:transform .15s}
  .nav-section.closed .chev{transform:rotate(-90deg)}
  .nav-section.closed .nav-items{display:none}
  .nav-items{display:flex;flex-direction:column;gap:2px;padding-bottom:6px}
  /* Icons only: no headings, and every icon stays reachable. */
  .nav-collapsed .nav-section-head{display:none}
  .nav-collapsed .nav-section.closed .nav-items{display:flex}
  .nav-collapsed .nav-section{padding:6px 0}
  /* Icons only. The labels come back as tooltips. */
  .nav-collapsed .sidebar{padding:16px 10px}
  .nav-collapsed .sidebar-head{display:flex;flex-direction:column;align-items:center;gap:12px;
                               padding:4px 0 14px;border-bottom:1px solid rgba(255,255,255,.09)}
  .nav-collapsed .collapse-btn{position:static}
  .nav a .twist{margin-left:auto;width:14px;height:14px;flex:none;opacity:.75;transition:transform .15s}
  .nav a .twist.open{transform:rotate(90deg)}
  .nav a.nav-child{margin-left:22px;font-size:13px}
  .nav a.nav-child .nav-arrow{width:16px;height:16px;flex:none;margin-right:9px;opacity:.7}
  .nav-collapsed .nav a{justify-content:center;padding:10px 0}
  .nav-collapsed .nav a .icon{margin-right:0}
  .nav-collapsed .nav a .label,.nav-collapsed .sidebar-foot{display:none}
  .nav-collapsed .nav a.active{border-left:0;padding-left:0;box-shadow:inset 3px 0 0 var(--brand-2)}
  .brand{display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 14px 14px;
         background:#fff;border-radius:12px;margin-bottom:10px}
  /* 212px, not smaller: below that the traced "SECURITY" letters blur. */
  .brand img{width:100%;max-width:212px;height:auto;display:block}
  .brand .product{font-size:15px;font-weight:800;letter-spacing:.14em;color:var(--navy);text-transform:uppercase}
  /* Quieter than the framework line above it: the edition is a fact to have
     available, not something to read every time. */
  .brand .edition{font-size:9px;font-weight:700;letter-spacing:.12em;color:var(--muted);
    text-transform:uppercase;opacity:.72;margin-top:1px}
  .brand .fw{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;
             text-align:center;line-height:1.45}
  /* In the sidebar: the white logo straight on the dark, no card behind it. */
  .brand.on-dark{background:none;border-radius:0;padding:12px 8px 14px;margin-bottom:2px;
                 border-bottom:1px solid rgba(255,255,255,.09)}
  .brand.on-dark img{max-width:172px}
  .brand.on-dark .product{color:#fff;letter-spacing:.16em;margin-top:2px}
  .brand.on-dark .fw{color:#94a3b8;font-weight:600}
  .brand.on-dark .edition{color:#94a3b8}
  .brand.on-dark.side{flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px 26px 14px;text-align:center}
  .ptile{width:46px;height:46px;border-radius:12px;background:rgba(143,192,255,.13);display:flex;align-items:center;justify-content:center}
  .ptile .pmark{width:27px;height:27px}
  .brand.side .names{min-width:0}
  .brand.side .pname{font-size:17px;font-weight:700;color:#fff;line-height:1.25}
  .brand.side .fw{text-transform:none;letter-spacing:0;font-size:11.5px;text-align:center;margin-top:2px;color:#8ea0bd}
  .pmark{width:32px;height:32px;flex:none;color:#8fc0ff}
  .sidebar-foot .credit{color:#94a3b8;font-weight:600}
  .nav a{display:flex;align-items:center;color:#aab4c8;padding:9px 12px;border-radius:9px;font-weight:500;cursor:pointer;text-decoration:none}
  .nav a .icon{width:18px;height:18px;flex:none;margin-right:11px;opacity:.8}
  .nav a:hover .icon,.nav a.active .icon{opacity:1}
  .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav a.active{background:rgba(36,87,214,.16);color:#fff;border-left:3px solid var(--brand-2);padding-left:8px}
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;background:var(--panel);border-bottom:1px solid var(--line)}
  .topbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
  .topbar .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .content{padding:24px 28px;flex:1}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:20px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  select,input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  .btn{font:inherit;font-weight:600;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
  /* A download is a link, and should look like the buttons beside it. */
  a.btn{display:inline-block;color:inherit;text-decoration:none}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .center{display:grid;place-items:center;min-height:100vh;background:var(--bg)}
  .login{width:100%;max-width:380px}
  .login .brand{background:#fff;border-radius:var(--radius) var(--radius) 0 0;padding:26px 24px 20px;
                margin:0;border-bottom:1px solid var(--line)}
  .fld{display:block;margin-bottom:14px}
  .fld span{display:block;font-size:12px;font-weight:600;color:var(--slate);margin-bottom:5px}
  .fld input,.fld textarea{width:100%;font:inherit;padding:7px 10px;border:1px solid var(--line);
                            border-radius:9px;background:#fff;color:var(--ink);resize:vertical}
  .err{color:var(--red);font-size:12.5px;margin-bottom:12px}
  .muted{color:var(--muted)}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;
        white-space:nowrap}
  .pill.green{background:#dcfce7;color:#166534} .pill.amber{background:#fef3c7;color:#92400e}
  .pill.slate{background:var(--slate-soft);color:var(--slate)} .pill.blue{background:#dbeafe;color:#1d4ed8}
  .legal{text-align:center;font-size:9.5px;color:#9aa4b2;padding:10px;border-top:1px solid var(--line);background:rgba(255,255,255,.95)}

  /* ── layout ─────────────────────────────────────────────────────────── */
  .grid{display:grid;gap:16px}
  .grid.cards{grid-template-columns:repeat(4,1fr)}
  .grid.two{grid-template-columns:1fr 1fr}
  @media (max-width:1180px){.grid.cards{grid-template-columns:repeat(2,1fr)}.grid.two{grid-template-columns:1fr}}
  @media (max-width:820px){.grid.cards{grid-template-columns:1fr}}
  /* A narrow window keeps the menu as a strip of icons rather than losing it.
     App.ts draws it collapsed there whatever the saved choice, and there is no
     room to open it, so the button goes. */
  @media (max-width:820px){
    .app.nav-collapsed{grid-template-columns:72px 1fr}
    .nav-collapsed .sidebar{padding:12px 6px;margin:8px 0 8px 8px;border-radius:16px}
    .collapse-btn{display:none}
    /* The header wraps instead of squeezing the title into a column, and a
       table wider than the screen scrolls inside its card instead of pushing
       the whole page sideways. */
    .topbar{flex-wrap:wrap;gap:10px;padding:12px 16px}
    .who{flex-wrap:wrap;gap:8px}
    .content{padding:14px 12px}
    .card{overflow-x:auto}
  }
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px}
  .section-title h2{font-size:14px;margin:0;font-weight:700;letter-spacing:-.005em}
  .sidebar-foot{flex:none;font-size:10px;line-height:1.45;color:#64748b;padding:8px 8px 0}
  .sidebar-foot .version{margin-top:3px}
  /* Its own gap, so the notice and the address never read as one sentence. */
  .sidebar-foot .contact{margin-top:0}
  /* A short window gets a tighter menu, so more of it shows without scrolling. */
  @media (max-height:820px){
    .brand.on-dark{padding:6px 8px 10px}
    .brand.on-dark img{max-width:140px}
    .brand.on-dark.side{padding:8px 26px 10px;gap:6px}
    .ptile{width:38px;height:38px}
    .nav a{padding:7px 12px}
    .nav-group{padding:6px 0}
  }
  /* A shorter one still gives up what is shown elsewhere: the signed-in name is
     in the top bar already, so the menu keeps its room for the menu. */
  @media (max-height:760px){
    .sidebar-user{display:none}
    .nav.pinned a{padding:6px 12px}
  }
  @media (max-height:680px){
    .sidebar-foot .lead{display:none}
    .brand.on-dark .fw{display:none}
    .brand.on-dark{padding:2px 8px 6px}
  }
  .sidebar-foot a{color:#94a3b8;text-decoration:none}
  .sidebar-foot a:hover{color:#e2e8f0;text-decoration:underline}

  /* ── topbar identity ────────────────────────────────────────────────── */
  .who{display:flex;align-items:center;gap:14px}
  .who-name{font-weight:600;font-size:13px;text-align:right}
  .who-role{font-size:11px;text-transform:capitalize;text-align:right}

  /* ── KPI cards ──────────────────────────────────────────────────────── */
  .stat{position:relative;display:block;text-decoration:none;color:inherit;
        transition:box-shadow .14s ease,transform .14s ease}
  a.stat:hover{transform:translateY(-2px);
    box-shadow:0 4px 16px rgba(16,24,40,.10),0 14px 30px rgba(16,24,40,.08)}
  a.stat:active{transform:translateY(0)}
  a.stat:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .stat .go{position:absolute;top:14px;right:16px;font-size:18px;line-height:1;
            color:var(--muted);opacity:.4;transition:.14s}
  a.stat:hover .go{opacity:1;color:var(--brand);transform:translateX(2px)}
  .stat .lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .stat .val{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px;line-height:1.1}
  .stat .delta{font-size:12px;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){
    .stat,.stat .go,.fresh-tile{transition:none}
    a.stat:hover,.fresh-tile:hover{transform:none}
  }

  /* ── readiness rows ─────────────────────────────────────────────────── */
  .fn-rows{display:flex;flex-direction:column;gap:14px}
  .fn-row{display:flex;gap:12px;align-items:flex-start}
  .fn-key{font-weight:800;font-size:12px;letter-spacing:.06em;width:26px;flex:none;padding-top:1px}
  .fn-body{flex:1;min-width:0}
  .fn-head{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:5px}
  .fn-head span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fn-note{font-size:11px;margin-top:4px}
  .bar{height:7px;border-radius:99px;background:#eef1f7;overflow:hidden}
  .bar span{display:block;height:100%;border-radius:99px;transition:width .3s ease}

  /* ── donut + legend ─────────────────────────────────────────────────── */
  .donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:170px}
  .legend div{display:flex;align-items:center;gap:9px;font-size:12.5px}
  .legend b{margin-left:auto;font-variant-numeric:tabular-nums}
  .dot{width:10px;height:10px;border-radius:3px;flex:none}

  /* ── risk score chip ────────────────────────────────────────────────── */
  .score{display:inline-block;min-width:28px;text-align:center;padding:2px 7px;border-radius:7px;
         color:#fff;font-weight:800;font-size:12px;font-variant-numeric:tabular-nums}

  /* ── controls table ─────────────────────────────────────────────────── */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .toolbar input[type=search]{flex:1;min-width:200px}
  .toolbar-note{font-size:12px;margin-left:auto;white-space:nowrap}
  .ref{display:inline-block;font-weight:700;font-size:11.5px;padding:2px 8px;border:1px solid;border-radius:7px;white-space:nowrap}
  .status-select{width:100%;font-size:12px;font-weight:700;border-radius:99px;padding:5px 10px;cursor:pointer}
  .status-select.green{background:#dcfce7;color:#166534;border-color:#bbf7d0}
  .status-select.amber{background:#fef3c7;color:#92400e;border-color:#fde68a}
  .status-select.slate{background:var(--slate-soft);color:var(--slate);border-color:#e2e8f0}
  .status-select.blue{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe}
  .owner-input{width:100%;font-size:13px;padding:5px 9px}
  tr.saving{opacity:.55}
  tbody tr:hover{background:#fafbfe}
  tbody tr.clickable{cursor:pointer}
  .toolbar .btn.primary{margin-left:0}

  /* ── risk heat map ──────────────────────────────────────────────────── */
  .heatmap{display:flex;flex-direction:column;gap:4px;position:relative;padding-left:6px}
  .hm-row{display:flex;gap:4px;align-items:stretch}
  .hm-axis{width:20px;display:flex;align-items:center;justify-content:center;
           font-size:11px;font-weight:700;color:var(--muted);flex:none}
  .hm-axis.bottom{flex:1;height:18px}
  .hm-cell{flex:1;aspect-ratio:1.7;border:none;border-radius:6px;color:#fff;font-weight:800;
           font-size:13px;display:flex;align-items:center;justify-content:center;padding:0}
  .hm-cell.has{cursor:pointer}
  .hm-cell.has:hover{outline:2px solid var(--ink);outline-offset:1px}
  .hm-cell:disabled{cursor:default}
  .hm-cap{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
          color:var(--muted);padding-left:24px}
  .hm-cap.end{text-align:right;padding:0 2px 0 0}

  /* ── evidence freshness strip ───────────────────────────────────────── */
  .fresh-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  @media (max-width:900px){.fresh-strip{grid-template-columns:repeat(2,1fr)}}
  .fresh-tile{text-align:left;background:#fff;border:1px solid var(--line);border-left:3px solid var(--tile);
              border-radius:11px;padding:12px 14px;cursor:pointer;font:inherit;
              transition:box-shadow .14s ease,transform .14s ease}
  .fresh-tile:hover{transform:translateY(-2px);
    box-shadow:0 4px 16px rgba(16,24,40,.10),0 14px 30px rgba(16,24,40,.08)}
  .fresh-tile:active{transform:translateY(0)}
  .fresh-tile.active{background:#f1f5ff;border-color:var(--brand);border-left-color:var(--tile)}
  .fresh-n{font-size:24px;font-weight:800;line-height:1.1;color:var(--tile)}
  .fresh-l{font-size:12.5px;font-weight:700;margin-top:2px}
  .fresh-note{font-size:10.5px;color:var(--muted)}

  /* ── dialog ─────────────────────────────────────────────────────────── */
  .modal{border:none;border-radius:16px;padding:0;width:min(720px,94vw);
         box-shadow:0 24px 60px rgba(16,24,40,.22);color:var(--ink);
         /* Dragged larger by the corner; the body grows with it. */
         resize:both;overflow:hidden;min-width:min(420px,94vw);min-height:280px;max-width:98vw;max-height:94vh}
  .modal[open]{display:flex;flex-direction:column}
  .modal > form{display:flex;flex-direction:column;flex:1;min-height:0}
  .modal.expanded{width:96vw;height:92vh}
  .modal.expanded .modal-body{max-height:none}
  .modal-tools{display:flex;align-items:center;gap:4px}
  .modal .icon.size{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px}
  .modal .icon.size:hover{background:var(--slate-soft)}
  .modal .icon.size svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .modal::backdrop{background:rgba(11,18,32,.45)}
  .modal header{display:flex;align-items:center;justify-content:space-between;
                padding:18px 22px;border-bottom:1px solid var(--line)}
  .modal header h2{font-size:16px;margin:0;font-weight:700}
  .modal .icon{border:none;background:none;font-size:22px;line-height:1;cursor:pointer;
               color:var(--muted);padding:0 4px}
  .modal-body{padding:20px 22px;max-height:min(66vh,560px);overflow:auto;flex:1 1 auto;min-height:0}
  /* Once dragged to a size, the body fills it rather than stopping at its usual height. */
  .modal[style*="height"] .modal-body{max-height:none}
  .modal footer{display:flex;gap:10px;align-items:center;padding:16px 22px;
                border-top:1px solid var(--line);background:#fbfcfe;border-radius:0 0 16px 16px}
  .modal footer .spacer{flex:1}
  .btn.danger{border-color:#fecaca;color:var(--red);background:#fff}
  .btn.danger:hover{background:#fef2f2}
  .btn:disabled{opacity:.55;cursor:default}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
  @media (max-width:640px){.form-grid{grid-template-columns:1fr}}
  .form-grid .fld{margin:0}
  .form-grid .fld.wide{grid-column:1 / -1}
  .form-grid input,.form-grid select,.form-grid textarea{width:100%;font:inherit;
    padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  .form-grid textarea{resize:vertical}
  .hint{display:block;font-size:11px;color:var(--muted);font-style:normal;margin-top:4px}
  .preview{grid-column:1 / -1;background:var(--slate-soft);border-radius:10px;
           padding:10px 14px;font-size:12.5px}

  /* ── link picker ────────────────────────────────────────────────────── */
  .link-picker{display:flex;flex-wrap:wrap;gap:7px;align-items:center;border:1px solid var(--line);
               border-radius:9px;padding:8px;background:#fff}
  .link-picker select{flex:1;min-width:180px;border:none;padding:4px}
  .chip{border:1px solid var(--line);background:var(--slate-soft);border-radius:99px;
        padding:3px 10px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--slate)}
  .chip:hover{background:#fee2e2;color:var(--red);border-color:#fecaca}

  /* ── version history ────────────────────────────────────────────────── */
  .history{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:9px;
           background:#fff;max-height:150px;overflow:auto}
  .history li{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;padding:8px 12px;
              border-bottom:1px solid var(--line);font-size:12.5px}
  .history li:last-child{border-bottom:none}
  .history li div{flex-basis:100%;font-size:11.5px}

  /* ── policy acknowledgements ────────────────────────────────────────── */
  .ack-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
  .ack-add input{flex:1;min-width:130px}

  /* ── control detail ─────────────────────────────────────────────────── */
  .detail-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;
               padding-bottom:14px;border-bottom:1px solid var(--line);font-size:12px}
  .form-grid select:disabled,.form-grid input:disabled,.form-grid textarea:disabled{
    background:var(--slate-soft);color:var(--slate);cursor:default}
  td.clickable{cursor:pointer}
  td.clickable:hover>div:first-child{color:var(--brand);text-decoration:underline}

  /* ── tiers ──────────────────────────────────────────────────────────── */
  .tier-row{padding:16px 0;border-top:1px solid var(--line)}
  .tier-row:first-of-type{border-top:none;padding-top:0}
  .tier-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
  .tier-name{font-weight:700;font-size:13px}
  .tier-badge{display:flex;align-items:center;gap:4px;flex:none}
  .tier-seg{display:inline-block;width:28px;height:7px;border-radius:2px;background:#e6eaf2}
  .tier-seg.at{background:#1e3a8a}
  .tier-seg.want{background:#c7d2fe}
  .tier-label{font-size:11.5px;margin-left:8px;white-space:nowrap}
  .tier-selects{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
  .tier-selects label{display:flex;align-items:center;gap:8px;font-size:12px}
  .tier-blurb{font-size:11.5px;margin:10px 0 0;max-width:70ch}

  /* ── stacked progress bar ───────────────────────────────────────────── */
  .stack-bar{display:flex;height:22px;border-radius:7px;overflow:hidden;background:var(--slate-soft)}

  /* ── priority tiles ─────────────────────────────────────────────────── */
  .pri-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .pri-tile{border:1px solid var(--line);border-top:3px solid var(--tile);border-radius:10px;
            padding:12px 10px;text-align:center}
  .pri-n{font-size:22px;font-weight:800;color:var(--tile);line-height:1.1}
  .pri-l{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:2px}

  /* ── statement of applicability ─────────────────────────────────────── */
  .soa-gap{margin-top:14px;padding:11px 14px;border-radius:10px;background:#f0fdf4;
           color:#166534;font-size:12.5px;line-height:1.5}
  .soa-gap.bad{background:#fef2f2;color:#991b1b}
  .linkish{border:none;background:none;padding:0;font:inherit;font-weight:700;color:inherit;
           text-decoration:underline;cursor:pointer}
  .owner-input.missing{border-color:#fca5a5;background:#fef2f2}

  /* ── baseline picker ────────────────────────────────────────────────── */
  .baseline-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media (max-width:900px){.baseline-grid{grid-template-columns:1fr}}
  .baseline-tile{border:1px solid var(--line);border-radius:11px;padding:14px 16px;
                 display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .baseline-tile.current{border-color:var(--brand);background:#f5f8ff}
  .baseline-name{font-weight:800;font-size:14px}
  .baseline-tile p{margin:0;font-size:12px;line-height:1.5;flex:1}
  .notice{background:#eff6ff;color:#1e40af;border-radius:10px;padding:10px 14px;
          font-size:12.5px;margin-bottom:14px}
  /* ── audit trail ──────────────────────────────────────────────────────── */
  .audit-date{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--slate)}
  .audit-date input{font:inherit;font-weight:400;padding:5px 8px;border:1px solid var(--line);border-radius:8px}
  .audit-sub{font-size:11.5px}
  .audit-table tr.open td{background:#f1f5f9}
  .audit-open-row td{background:#f8fafc;padding:12px 16px}
  .audit-values{width:auto;min-width:60%;margin:0 0 8px}
  .audit-values th{text-transform:none;letter-spacing:0;font-size:12px;color:var(--slate);white-space:nowrap;width:1%}
  .audit-values td{font-size:12.5px;word-break:break-word}
  .audit-cap{font-size:11.5px;margin-bottom:4px}
  .audit-meta{font-size:11px;margin-top:6px}
  .confirm{margin-top:14px;border:1px solid #fde68a;background:#fffbeb;border-radius:11px;
           padding:14px 16px;font-size:12.5px;line-height:1.55}
  .confirm-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}

  /* ── 800-53 parameters ──────────────────────────────────────────────── */
  .params{border:1px solid var(--line);border-radius:11px;padding:14px 16px;background:#fbfcfe}
  .params-head{display:flex;justify-content:space-between;font-size:12px;font-weight:700;
               margin-bottom:12px}
  .param{display:block;margin-bottom:12px}
  .param:last-child{margin-bottom:0}
  .param-id{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--slate)}
  .param-hint{display:block;font-size:11.5px;line-height:1.45;margin:2px 0 5px}
  .param input,.param select{width:100%;font:inherit;padding:7px 10px;border:1px solid var(--line);
                             border-radius:9px;background:#fff;color:var(--ink)}

  /* -- due dates on the register --------------------------------------- */
  .due{font-size:12px;white-space:nowrap}
  .due.soon{color:#b45309;font-weight:600}
  .due.overdue{color:var(--red);font-weight:700}
  .due .muted{font-size:11px}

  /* -- sub-tabs, and the sample library ---------------------------------- */
  .sub-tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}
  .sub-tabs button{font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
    background:none;border:0;border-bottom:2px solid transparent;color:var(--slate);
    padding:8px 14px;margin-bottom:-1px}
  .sub-tabs button:hover{color:var(--ink)}
  .sub-tabs button.sel{color:var(--brand);border-bottom-color:var(--brand)}

  /* Help and the guides: a list on the left, the page on the right. */
  .help-layout{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px;align-items:start}
  @media (max-width:900px){ .help-layout{grid-template-columns:1fr} }
  .help-index{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
  .help-group{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--slate);margin:16px 10px 6px}
  .help-group:first-of-type{margin-top:6px}
  .toc{border:1px solid var(--line);border-radius:10px;background:var(--slate-soft);
    padding:12px 16px;margin-bottom:20px}
  .toc-h{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--slate);margin-bottom:6px}
  .toc ol{margin:0;padding:0;list-style:none;columns:2 260px;column-gap:28px}
  .toc li{margin:0 0 4px;break-inside:avoid}
  .toc button{background:none;border:0;padding:0;font:inherit;font-size:12.5px;
    color:var(--brand);cursor:pointer;text-align:left}
  .toc button:hover{text-decoration:underline}
  .help-pick{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;
    background:none;border:0;border-left:3px solid transparent;border-radius:6px;
    padding:9px 10px;margin-bottom:2px}
  .help-pick:hover{background:var(--slate-soft)}
  .help-pick.sel{background:var(--slate-soft);border-left-color:var(--brand)}
  .help-pick-title{display:block;font-weight:700;font-size:13px;color:var(--ink)}
  .help-pick-about{display:block;font-size:11.5px;color:var(--slate);margin-top:2px}
  .help-body{min-height:60vh}

  /* Rendered markdown. Narrow enough to read, and printable. */
  .prose{max-width:none;color:var(--ink);font-size:13.5px;line-height:1.65}
  .prose h1{font-size:21px;margin:0 0 14px}
  .prose h2{font-size:16px;margin:26px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
  .prose h3{font-size:14px;margin:20px 0 6px}
  .prose h1:first-child,.prose h2:first-child{border-top:0;padding-top:0;margin-top:0}
  .prose p{margin:0 0 12px}
  .prose ul,.prose ol{margin:0 0 12px;padding-left:20px}
  .prose li{margin-bottom:5px}
  .prose table{margin:0 0 16px}
  .prose th,.prose td{font-size:12.5px;vertical-align:top}
  .prose code{background:var(--slate-soft);border:1px solid var(--line);border-radius:4px;
    padding:1px 5px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
  .prose pre{background:var(--slate-soft);border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;overflow:auto;margin:0 0 14px}
  .prose pre code{background:none;border:0;padding:0;font-size:12px}
  .prose blockquote{margin:0 0 14px;padding:8px 14px;border-left:3px solid var(--brand);
    background:var(--slate-soft);border-radius:0 6px 6px 0}
  .prose hr{border:0;border-top:1px solid var(--line);margin:22px 0}
  .prose a{color:var(--brand)}

  .sl-note{font-size:12.5px;line-height:1.6;color:var(--slate);margin:0 0 14px;max-width:78ch}
  .sl-groups{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .sl-group{font:inherit;font-size:12px;cursor:pointer;background:#fff;color:var(--ink);
    border:1px solid var(--line);border-radius:999px;padding:6px 13px;
    display:inline-flex;align-items:center;gap:8px}
  .sl-group:hover{border-color:var(--brand);color:var(--brand)}
  .sl-group.sel{background:var(--brand);border-color:var(--brand);color:#fff}
  .sl-count{font-size:10.5px;opacity:.7}
  .sl-head{display:flex;justify-content:space-between;align-items:center;gap:14px;
    margin-bottom:12px}
  .sl-head h2{margin:0;font-size:15px}

  .sl-list{display:grid;gap:8px}
  .sl-row{display:flex;align-items:flex-start;gap:12px;background:#fff;
    border:1px solid var(--line);border-radius:11px;padding:11px 13px;
    transition:border-color .15s ease}
  .sl-row:hover{border-color:#cbd8ea}
  /* Dimmed rather than removed: a list that reshuffles as you work down it
     loses your place every time you click. */
  .sl-row.taken{background:#fafbfc;opacity:.62}
  .sl-main{flex:1;min-width:0}
  .sl-name{font-size:13px;font-weight:600}
  .sl-desc{font-size:12px;line-height:1.55;margin-top:3px}
  .sl-meta{font-size:11.5px;margin-top:5px;display:flex;flex-wrap:wrap;gap:7px;
    align-items:center}
  .sl-refs{font-size:11px;background:var(--slate-soft);border-radius:999px;padding:2px 8px}
  .sl-band{font-weight:800;border-radius:999px;padding:2px 8px;font-size:10.5px}
  .sl-band.low{background:rgba(22,163,74,.14);color:#15803d}
  .sl-band.med{background:rgba(217,119,6,.14);color:#b45309}
  .sl-band.high{background:rgba(220,38,38,.12);color:var(--red)}
  .sl-band.crit{background:var(--red);color:#fff}
  .sl-in{font-size:11px;font-weight:700;color:#15803d;white-space:nowrap;padding-top:3px}

  /* ── evidence, on a control ─────────────────────── */
  .ev-panel{border:1px solid var(--line);border-radius:11px;padding:13px 15px;
    background:#fbfcfe}
  .ev-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    color:var(--slate);margin-bottom:10px}
  .ev-head .muted{font-size:11px;font-weight:600;letter-spacing:0;text-transform:none}
  .ev-empty{font-size:12px;line-height:1.55;margin:0}
  .ev-list{display:grid;gap:7px;margin-bottom:11px}
  .ev-row{display:flex;align-items:center;gap:9px;background:#fff;
    border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  .ev-main{flex:1;min-width:0}
  .ev-name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .ev-meta{font-size:11px;margin-top:2px}
  .ev-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
  /* A file input styled as a button: the native control cannot be, so it is
     hidden inside a label that can. */
  .ev-file{position:relative;overflow:hidden;cursor:pointer}
  .ev-file input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
  .ev-picker{margin-top:11px;border-top:1px solid var(--line);padding-top:11px;
    display:grid;gap:7px}
  .ev-picker>input{width:100%;font:inherit;font-size:12.5px;padding:7px 10px;
    border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  .ev-pick{display:flex;justify-content:space-between;gap:12px;align-items:baseline;
    text-align:left;font:inherit;font-size:12.5px;cursor:pointer;background:#fff;
    border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--ink)}
  .ev-pick:hover{border-color:var(--brand);color:var(--brand)}
  .ev-pick .muted{font-size:11px;white-space:nowrap}
  .ev-new-row{display:flex;gap:7px;flex-wrap:wrap}
  .ev-new-row select,.ev-new-row input{font:inherit;font-size:12.5px;padding:7px 10px;
    border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  .ev-new-row input{flex:1;min-width:120px}

  /* ── the readiness plan ─────────────────────────────────── */
  .journey-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
  .journey-score{text-align:right;white-space:nowrap}
  .journey-pct{font-size:30px;font-weight:800;line-height:1.1}
  .stage-flow{width:100%;height:auto;margin:14px 0 2px;display:block}
  .stage-node{cursor:pointer}
  .stage-node:focus{outline:none}
  .stage-node:focus-visible circle:first-of-type{stroke-width:5}
  .stage-node:hover text{fill:var(--brand)}

  .jt-list{display:grid;gap:12px}
  .jt{border:1px solid var(--line);border-left:3px solid var(--slate);border-radius:11px;
      padding:13px 15px;background:#fff}
  .jt.done{border-left-color:#16a34a;background:#f6fdf8}
  .jt.not_applicable{border-left-color:#cbd5e1;background:#fafbfc}
  .jt.not_applicable .jt-title,.jt.not_applicable .jt-do{color:var(--slate)}
  .jt-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
  .jt-title{font-weight:700;font-size:13.5px}
  .jt-do{margin:7px 0 0;font-size:12.5px;line-height:1.6}
  .jt-why{margin:6px 0 0;font-size:12px;line-height:1.55}
  .jt-detail{margin-top:7px;font-size:11.5px;font-style:italic}
  .jt-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:11px}
  .jt-auto{font-size:11.5px}
  .jt-template .btn{white-space:nowrap;flex:none}
  .jt-template{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:10px;padding:10px 12px;
               border-radius:9px;background:rgba(36,87,214,.06);border:1px solid rgba(36,87,214,.2);font-size:12.5px;line-height:1.5}
  /* The clause a step satisfies, beside its title. */
  .jt-clause{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:99px;font-size:11px;
             font-weight:700;background:var(--slate-soft);color:var(--slate);vertical-align:middle}
  .jt-chip{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
           border-radius:999px;padding:3px 9px;white-space:nowrap}
  .jt-chip.done{background:rgba(22,163,74,.13);color:#15803d}
  .jt-chip.todo{background:rgba(217,119,6,.13);color:#b45309}
  .jt-chip.na{background:rgba(100,116,139,.13);color:var(--slate)}
  .btn.small{font-size:11.5px;padding:5px 10px}
  .btn.ghost{background:transparent;color:var(--slate)}
  .stage-nav{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;
             border-top:1px solid var(--line);padding-top:14px}
  .journey-foot{display:flex;justify-content:flex-end;align-items:center;gap:16px;
                margin-top:2px}
  .linkish{border:0;background:none;padding:0;font:inherit;color:var(--brand);cursor:pointer;
           text-decoration:underline;text-decoration-color:rgba(36,87,214,.35);text-underline-offset:3px}
  .linkish:hover{text-decoration-color:var(--brand)}
  .journey-how{margin:10px 0 0;max-width:90ch;font-size:12.5px;line-height:1.6}
  /* The next step: the one thing to do now, set apart from the plan below. */
  .next-step{margin-top:16px;border:2px solid var(--brand);box-shadow:var(--shadow)}
  .next-step.done{border-color:var(--green)}
  .next-eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin-bottom:10px}
  .next-step.done .next-eyebrow{color:var(--green)}
  .jt.featured{border:0;padding:0;background:none}
  .jt.featured .jt-title{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .jt.featured .jt-do{font-size:13.5px}
  .jt.featured .jt-why{font-size:12.5px}
  .next-after{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px}
  .journey-extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px;margin-top:16px;align-items:start}
  .journey-extras>.card{margin:0}
  .wins-head{font-weight:800;font-size:14px}
  .win{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .win-title{font-weight:700;font-size:13px}
  .win-detail{font-size:12px}

  .lp{display:flex;flex-direction:column;gap:8px}
  .lp-chips{display:flex;flex-wrap:wrap;gap:6px}
  .lp-search{width:100%}
  .lp-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:9px;background:#fff;
           max-height:280px;overflow-y:auto;resize:vertical;min-height:90px}
  .lp-opt{display:flex;gap:9px;align-items:flex-start;text-align:left;padding:7px 10px;font-size:12.5px;cursor:pointer;
          border-top:1px solid var(--line);margin:0}
  .lp-opt:first-child{border-top:0}
  .lp-opt input{margin:2px 0 0;flex:none;width:15px;height:15px;accent-color:var(--brand)}
  .lp-opt:hover,.lp-opt:focus-within{background:var(--slate-soft)}
  .lp-opt.on{background:rgba(36,87,214,.06)}
  .lp-none{padding:8px 10px;font-size:12.5px}
  .lp-more{padding:6px 10px;font-size:12px;border-top:1px solid var(--line, #e2e8f0)}
  .lp-create{border:0;border-top:1px solid var(--line);background:rgba(36,87,214,.06);color:var(--brand);text-align:left;
             padding:8px 10px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .lp-create:hover{background:rgba(36,87,214,.12)}
  .help-version{margin:-4px 0 10px;font-size:12px;font-weight:600;color:var(--muted)}
  .dup-note{background:#fffbeb;border:1px solid #fcd34d;font-size:13px;color:#92400e}
  .lp-suggest{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px}
  .lp-sug{background:rgba(36,87,214,.08);border-color:rgba(36,87,214,.3);color:var(--brand)}

  /* ── golden thread ───────────────────────────────────────── */
  .gt-summary{display:flex;align-items:center;justify-content:space-between;gap:16px;text-decoration:none;color:inherit;margin:0}
  .gt-summary:hover{border-color:var(--brand)}
  .gt-summary-line{font-size:13.5px;margin-top:4px}
  .gt-summary-line b.bad{color:var(--red)} .gt-summary-line b.warn{color:var(--amber)} .gt-summary-line b.ok{color:var(--green)}
  .gt-eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .gt-bar{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;margin:16px 0;padding:14px 0;border-block:1px solid var(--line)}
  .gt-stats{display:flex;gap:22px;flex-wrap:wrap}
  .gt-stats div{font-size:12px;color:var(--muted);max-width:150px;line-height:1.35}
  .gt-stats b{display:block;font-size:26px;font-weight:800;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
  .gt-stats .ok b{color:var(--green)} .gt-stats .bad b{color:var(--red)} .gt-stats .warn b{color:var(--amber)}
  .gt-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .gt-seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px;background:var(--slate-soft)}
  .gt-seg button{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:99px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  .gt-seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
  .gt-search{border-radius:99px;width:240px;max-width:100%;font-size:12.5px}
  .gt-wrap{overflow-x:auto;border-radius:12px;background:var(--slate-soft);padding:14px 12px;min-width:0}
  .gt-map{display:block}
  .gt-colh{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;fill:var(--muted)}
  .gt-theme{font-size:12px;font-weight:800;fill:var(--brand)}
  .gt-empty{font-size:14px;fill:var(--muted)}
  .gt-p{fill:none;stroke:#c3cdd6;stroke-width:1.3;opacity:.8;transition:opacity .2s,stroke .2s}
  .gt-p.ok{stroke:var(--green);opacity:.85}
  .gt-p.bad{stroke:var(--red);stroke-dasharray:5 4;opacity:1}
  .gt-p.warn{stroke:var(--amber);stroke-dasharray:5 4;opacity:1}
  .gt-n{cursor:pointer;transition:opacity .2s}
  .gt-n:focus{outline:none}
  .gt-n:focus-visible .gt-box{stroke:var(--brand);stroke-width:2}
  .gt-box{fill:#fff;stroke:var(--line)}
  .gt-n:hover .gt-box{stroke:var(--brand)}
  .gt-n.ok .gt-box{fill:#eef9f2;stroke:#86d0a2}
  .gt-n.bad .gt-box{fill:#fdecec;stroke:var(--red)}
  .gt-n.warn .gt-box{fill:#fdf3e3;stroke:var(--amber)}
  .gt-n.na .gt-box{fill:transparent;stroke-dasharray:3 3}
  .gt-n.na text{fill:var(--muted)}
  .gt-n text{font-size:12.5px;fill:var(--ink)}
  .gt-n text.gt-ref{font-family:ui-monospace,Consolas,monospace;font-size:11px;fill:var(--muted)}
  .gt-n text.gt-sm{font-size:11px;fill:var(--muted)}
  .gt-n text.gt-own{fill:var(--brand);font-weight:700}
  .gt-map.focus .gt-p,.gt-map.focus .gt-n{opacity:.13}
  .gt-map.focus .gt-p.on,.gt-map.focus .gt-n.on{opacity:1}
  .gt-map.focus .gt-p.on:not(.bad):not(.warn){stroke:var(--brand);stroke-width:2.2;stroke-dasharray:7 5;animation:gt-flow 1s linear infinite}
  @keyframes gt-flow{to{stroke-dashoffset:-12}}
  .gt-drawer{position:fixed;z-index:20;right:24px;bottom:24px;width:340px;max-height:calc(100vh - 160px);overflow:auto;
             background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;
             box-shadow:0 12px 40px rgba(16,24,40,.18);animation:gt-in .18s ease-out}
  .gt-drawer h3{margin:2px 28px 6px 0;font-size:15px;line-height:1.3}
  .gt-drawer p{margin:0 0 8px;font-size:12.5px}
  @keyframes gt-in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
  .gt-close{position:absolute;top:10px;right:10px;width:30px;height:30px;border:0;border-radius:8px;background:none;
            font-size:20px;line-height:1;color:var(--muted);cursor:pointer}
  .gt-close:hover{background:var(--slate-soft);color:var(--ink)}
  .gt-k{font-size:11px;color:var(--muted);margin:12px 0 4px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
  .gt-item{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0;flex-wrap:wrap}
  .gt-link{border:0;background:none;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left;
           text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
  .gt-link:hover{text-decoration-color:var(--brand)}
  .gt-tag{font-size:10.5px;padding:2px 8px;border-radius:99px;font-weight:800;white-space:nowrap}
  .gt-tag.ok{background:rgba(22,163,74,.13);color:#15803d} .gt-tag.warn{background:rgba(217,119,6,.14);color:#b45309}
  .gt-tag.bad{background:rgba(220,38,38,.12);color:#b91c1c} .gt-tag.prog{background:rgba(36,87,214,.1);color:var(--brand)}
  .gt-tag.na{background:var(--slate-soft);color:var(--muted)}
  .gt-problem{margin-top:12px;padding:11px 12px;border-radius:10px;font-size:12.5px;line-height:1.5}
  .gt-actions,.gt-linker-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .gt-linker{margin-top:4px}
  .gt-change{font-size:11px;text-transform:none;letter-spacing:0;margin-left:6px}
  .gt-problem.bad{background:#fdecec} .gt-problem.warn{background:#fdf3e3} .gt-problem.ok{background:#eaf7ef}
  .gt-key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted);margin:0 0 12px}
  .gt-key-hint{margin-left:auto;color:var(--ink)}
  .gt-key span{display:flex;align-items:center;gap:8px}
  .gt-key i{display:inline-block;width:22px;border-top:2px solid #c3cdd6}
  .gt-key i.ok{border-top:2px solid var(--green)}
  .gt-clause{align-items:flex-start;flex-wrap:nowrap;gap:9px}
  .gt-clause-text{flex:1;min-width:0}
  .gt-howto{display:block;margin-top:5px;font-size:12px}
  .gt-howto .btn{margin-top:6px}
  .gt-repair{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 14px;padding:11px 14px;
             border-radius:10px;background:#fdf3e3;border:1px solid #f3dcae;font-size:12.5px;line-height:1.5}
  .gt-repair.ok{background:#eaf7ef;border-color:#bfe3cd;display:block}
  .gt-chip{cursor:pointer}
  .gt-chip text{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;font-weight:700;fill:#fff}
  .gt-chip.ok .gt-chip-box{fill:var(--green)} .gt-chip.warn .gt-chip-box{fill:var(--amber)} .gt-chip.bad .gt-chip-box{fill:var(--red)}
  .gt-dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:4px}
  .gt-dot.ok{background:var(--green)} .gt-dot.warn{background:var(--amber)} .gt-dot.bad{background:var(--red)}
  .gt-key i.bad{border-top:2px dashed var(--red)} .gt-key i.warn{border-top:2px dashed var(--amber)} .gt-key i.na{border-top:2px dashed var(--line)}
  @media (max-width:720px){.gt-drawer{left:12px;right:12px;top:auto;bottom:12px;width:auto;max-height:60vh}}
  @media (prefers-reduced-motion:reduce){.gt-map.focus .gt-p.on{animation:none}}

  /* ── framework guidance, above the score ──────────────────── */
  .guide-panel{border:1px solid var(--line);border-left:3px solid var(--brand);
               border-radius:11px;padding:12px 15px;background:#fbfcfe;margin-bottom:16px;
               font-size:12.5px;line-height:1.55}
  .guide-panel p{margin:0 0 8px}
  /* The explanation is the first thing somebody needs, so it is set a size
     larger than the rest of the panel rather than buried in it. */
  .guide-panel p.guide-lede{font-size:13.5px;line-height:1.6;margin-bottom:10px}
  .guide-panel p:last-child{margin-bottom:0}
  .guide-panel b{color:var(--slate)}
  .guide-source{margin-top:6px}
  .guide-source summary{cursor:pointer;font-weight:600;color:var(--slate);font-size:12px}
  .guide-source p{margin:6px 0 0}

  /* ── theme grid (many families) ─────────────────────────────────────── */
  .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
  .theme-tile{border:1px solid var(--line);border-radius:9px;padding:8px 8px 9px;text-align:center}
  .theme-key{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--slate)}
  .theme-pct{font-size:16px;font-weight:800;line-height:1.2;margin:1px 0 5px}
  .theme-meter{height:4px;border-radius:99px;background:#eef1f7;overflow:hidden}
  .theme-meter span{display:block;height:100%;border-radius:99px}
  .theme-tile.out{background:#fafbfe;border-style:dashed}
  .theme-tile.out .theme-pct{color:#94a3b8}

  /* ── reports ────────────────────────────────────────────────────────── */
  .report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .report{display:flex;flex-direction:column;gap:8px}
  .report-title{font-size:14px;font-weight:700;color:var(--navy)}
  .report p{margin:0;font-size:12.5px;line-height:1.55;flex:1}
  .report-foot{display:flex;align-items:center;gap:10px;margin-top:4px}

  /* ── people ─────────────────────────────────────────────────────────── */
  /* —— settings ———————————————————————— */
  .settings-stack{display:flex;flex-direction:column;gap:18px}
  .section-h{margin:0 0 4px;font-size:15px;font-weight:700;color:var(--navy)}
  .section-note{margin:0 0 16px;font-size:12.5px;line-height:1.55;max-width:70ch}
  /* ISMS: one card per clause, text across the full width */
  .isms{display:flex;flex-direction:column;gap:16px}
  .isms .section-note{max-width:none}
  .isms-head{margin-bottom:8px}
  .isms-head .clause{font-weight:600;font-size:12px;margin-left:6px}
  .isms-head .row-actions{display:flex;gap:8px}
  .isms-text{width:100%;font:inherit;line-height:1.55;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);resize:vertical}
  .isms-table{overflow-x:auto}
  .isms .empty-note{padding:14px 0 4px;font-size:13px}
  .update-offer{margin:4px 0 8px}
  .update-notes{white-space:pre-wrap;font:inherit;font-size:13px;background:var(--slate-soft);border-radius:9px;padding:10px 12px;margin:6px 0 10px;max-height:260px;overflow:auto}
  .ok-note{color:#047857;font-size:12.5px;margin-bottom:12px;font-weight:600}
  /* Filling the ISMS documents in */
  .tpl-banner{display:flex;gap:18px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;
    padding:14px 16px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--slate-soft)}
  .tpl-banner>div:first-child{flex:1 1 420px;line-height:1.55}
  .tpl-meter{height:8px;border-radius:99px;background:#fff;border:1px solid var(--line);margin:10px 0 4px;overflow:hidden;max-width:420px}
  .tpl-meter i{display:block;height:100%;background:#16a34a}
  .tpl-blank{font-size:11.5px;margin-left:4px}
  .tpl-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .tpl-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:900px){.tpl-layout{grid-template-columns:1fr}}
  .tpl-nav{padding:6px;position:sticky;top:12px;max-height:calc(100vh - 40px);overflow:auto}
  .tpl-nav button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;text-align:left;
    font:inherit;font-size:12.5px;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--ink);cursor:pointer}
  .tpl-nav button:hover{background:var(--slate-soft)}
  .tpl-nav button.sel{background:var(--slate-soft);font-weight:700}
  .tpl-nav em{font-style:normal;font-size:11px;color:var(--muted)}
  .form-grid>.wide{grid-column:1 / -1}
  /* "How to fix this" on a control */
  .fix-panel{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0 14px;background:#fffbeb}
  .fix-panel.all-ok{background:#f0fdf4}
  .fix-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;margin-bottom:6px}
  .fix-panel ul{list-style:none;margin:0;padding:0}
  .fix-panel li{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12.5px;border-top:1px solid rgba(0,0,0,.05)}
  .fix-panel li:first-child{border-top:0}
  .fix-panel .what{flex:1}
  .fix-panel .dot{width:9px;height:9px;border-radius:50%;flex:none;background:#16a34a}
  .fix-panel li.bad .dot{background:#dc2626}
  .thread-strip{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:9px;padding:9px 10px 10px;margin-bottom:10px}
  .ts-head{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}
  .ts-state{font-weight:700;color:var(--muted)}
  .ts-state.ok{color:#15803d}.ts-state.bad{color:#dc2626}
  .ts-row{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,.85fr) 22px minmax(0,1fr);align-items:center;gap:4px}
  .ts-col{display:flex;flex-direction:column;gap:5px;min-width:0}
  .ts-cap{font-size:11px;color:var(--muted)}
  .ts-chip,.ts-ctl{display:block;text-align:left;font:inherit;font-size:12px;line-height:1.35;padding:6px 8px;border-radius:7px;
    border:1px solid #e2e8f0;background:#f8fafc;color:inherit;overflow:hidden;text-overflow:ellipsis}
  button.ts-chip,button.ts-ctl{cursor:pointer}
  .ts-chip small,.ts-ctl small{display:block;font-size:11px;font-weight:400;opacity:.85}
  .ts-ctl{text-align:center;font-weight:700;border-width:1.5px}
  .ts-chip.ok,.ts-ctl.ok{background:#f0fdf4;border-color:#86efac;color:#166534}
  .ts-chip.bad,.ts-ctl.bad{background:#fef2f2;border-color:#fca5a5;color:#991b1b}
  .ts-arrow{text-align:center;font-size:16px;color:var(--muted)}
  .ts-arrow.ok{color:#16a34a}.ts-arrow.bad{color:#dc2626}
  .ts-more{font-size:11px;color:var(--muted)}
  .fix-check{display:flex;gap:10px;align-items:center;font-size:12px}
  .ts-edit{font-size:11.5px;text-align:left;padding:0}
  .ts-link{background:#fff;border:1px solid #bfdbfe;border-radius:9px;padding:10px 12px;margin-bottom:10px;font-size:13px}
  .ts-link p{margin:4px 0 8px;font-size:12px}
  .ts-link-actions{display:flex;gap:8px;margin-top:10px}
  .fix-panel li.weak .dot{background:#d97706}
  .tpl-section{margin-top:18px}
  .tpl-section h3{font-size:13px;margin:0 0 10px;color:var(--slate)}
  .tpl-source{padding:10px 12px;border:1px dashed var(--line);border-radius:9px;font-size:12.5px;line-height:1.5;background:var(--slate-soft)}
  .tpl-grid td,.tpl-list td{vertical-align:top}
  .tpl-grid input,.tpl-list input{width:100%;min-width:90px;font:inherit;font-size:12px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
  .tpl-pick{font:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .tpl-save{margin-top:14px}
  .linklike{border:0;background:none;padding:0;font:inherit;color:var(--blue,#1d4ed8);cursor:pointer;text-decoration:underline}
  .pill.red{background:#fee2e2;color:#991b1b}
  /* Settings → HTTPS certificate */
  .section-h .pill{margin-left:8px;vertical-align:2px}
  .cert-facts{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0 0 12px;font-size:13px}
  .cert-facts dt{color:var(--slate);font-weight:600}
  .cert-facts dd{margin:0;overflow-wrap:anywhere}
  .cert-facts .mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
  .cert-warnings{margin:0 0 14px;padding:10px 12px 10px 30px;background:#fffbeb;border:1px solid #fde68a;border-radius:9px;font-size:12.5px;line-height:1.55;color:#92400e}
  .cert-restart{margin:0 0 14px;padding:10px 12px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:9px;font-size:12.5px;line-height:1.55}
  .cert-restart .muted{margin-top:4px}
  .cert-pending{margin:4px 0 14px;padding:12px;border:1px solid var(--line);border-radius:9px}
  .cert-pending>strong{display:block;margin-bottom:10px}
  .cert-upload{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px}
  .cert-password{max-width:320px}
  .cert-remove{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px}
  .section-note code{background:var(--slate-soft);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
  /* A checkbox reads as one line, not as a label stacked above a control. */
  .form-grid .fld.check{display:flex;flex-direction:row;align-items:flex-start;gap:10px}
  .form-grid .fld.check input[type=checkbox]{width:auto;flex:none;margin-top:2px}
  .form-grid .fld.check>span{font-weight:500;color:var(--ink);font-size:13px;margin-bottom:0}
  .form-grid .fld.check .hint{display:block;margin-top:3px;max-width:70ch}
  .form-actions{margin-top:18px}
  /* Maturity scoring, for frameworks that rate rather than tick. */
  .maturity-cell{display:flex;flex-direction:column;gap:3px}
  .maturity-select{font:inherit;font-size:12px;font-weight:600;padding:5px 8px;
    border-radius:8px;border:1.5px solid var(--line);background:#fff;max-width:200px}
  .maturity-target{font-size:10.5px;display:flex;align-items:center;gap:4px}
  .maturity-target select{font:inherit;font-size:10.5px;padding:1px 3px;border:1px solid var(--line);
    border-radius:5px;background:#fff;color:inherit}
  /* The attached document in the evidence table. */
  .file-cell{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12.5px}
  .file-cell a{color:var(--brand);font-weight:600;text-decoration:none;
    max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file-cell a:hover{text-decoration:underline}
  .file-cell .linkish{font-size:11.5px}
  /* A file input is unstyleable, so the label is the control and the input hides. */
  .file-pick{cursor:pointer}
  .file-pick input[type=file]{display:none}
  button.linkish{background:none;border:0;padding:0;font:inherit;cursor:pointer}
  button.linkish.danger{color:var(--red)}
  /* The digest preview: a plain-text email shown as it will arrive. */
  .preview{margin-top:18px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .preview-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:10px 14px;background:#f6f8fc;border-bottom:1px solid var(--line);font-size:12.5px}
  .preview-note{padding:10px 14px;font-size:12.5px;border-bottom:1px solid var(--line)}
  .preview pre{margin:0;padding:14px;font-size:12px;line-height:1.5;white-space:pre-wrap;
    word-break:break-word;max-height:420px;overflow:auto;background:#fff}
  .form-grid textarea{min-height:70px}
  .row-actions{display:flex;gap:12px;flex-wrap:wrap}
  .row-actions .linkish{font-weight:600;color:var(--brand);font-size:12.5px;text-decoration:none}
  .row-actions .linkish:hover{text-decoration:underline}
  .row-actions .linkish:disabled{color:var(--muted);cursor:default;text-decoration:none}
  .pw-row{display:flex;gap:8px}
  .pw-row input{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .form-grid .wide button{width:auto}
  .issued{margin-top:16px;border-color:#bfdbfe;background:#f5f9ff}
  .issued-pw{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:15px;font-weight:700;background:#fff;border:1px solid var(--line);
             border-radius:9px;padding:9px 14px;letter-spacing:.02em;user-select:all}

  /* ── report branding ────────────────────────────────────────────────── */
  .branding-row{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
  /* 190x80 box, 10px padding, so the usable area is 170x60. The image maxima
     are those numbers in pixels rather than 100%: a percentage max-height on a
     grid item resolves against the auto-sized row, which is the image's own
     height, so it never constrains anything and a tall logo escapes the box.
     overflow:hidden is the backstop if either number is ever changed alone. */
  .logo-well{width:190px;height:80px;flex:none;border:1px dashed var(--line);border-radius:11px;
             background:#fff;display:grid;place-items:center;padding:10px;font-size:12px;
             overflow:hidden}
  .logo-well img{max-width:170px;max-height:60px;object-fit:contain;display:block}
  .branding-copy{flex:1;min-width:260px}
  .branding-copy p{margin:0 0 8px;font-size:12.5px;line-height:1.55}
  .branding-actions{display:flex;gap:10px;margin-top:12px}
  .branding-actions .btn{cursor:pointer}
  .branding-actions .btn.disabled{opacity:.55;cursor:default}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/{{BUNDLE}}"></script>
</body>
