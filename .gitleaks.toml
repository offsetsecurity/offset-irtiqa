# Secret scanning, on top of gitleaks' own rules.
#
# The installation guide has to tell a beginner what the "make a random value"
# command prints. For a while it printed a whole 64-character example, and
# then half of one. A scanner cannot tell an example from a real key, so both
# failed the build - and a value printed in a public document is no secret
# anyway, so the guide now describes it in words instead.
#
# Those two example values are still in this repository's history, where they
# cannot be removed without rewriting commits that are already published and
# tagged. They are named here by their first 24 characters, which is what both
# the full and the shortened form share. Nothing else is excused: anything
# that is not one of these two strings, or the one generated file named further
# down, still fails the build.

title = "Offset Security GRC"

[extend]
useDefault = true

[allowlist]
description = "The example values that appeared in docs/docker-guide.md and docs/install-page.md before the guide stopped printing them. Never used by anything. Also one generated file of template field names."
regexes = [
  '''3f9c1a77e0b4d25a8c6e19fb''',
  '''a1d84f60c3b29e7514ad0f63''',
]
# The list of blanks in the ISMS document templates is made by the build that makes the
# templates; every line is the name of a blank to fill in, such as "reporting_frequency".
# Its first version called that field "key", which the scanner reads as an API key. The
# field is now "name", but the first version is in published history, so this one
# generated file is excused. It holds field names and no secrets.
paths = [
  '''packs/[^/]+/templates/fields\.json''',
]
